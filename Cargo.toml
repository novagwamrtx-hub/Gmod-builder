[workspace]
resolver = "2"
members = ["crates/core", "crates/desktop", "crates/extension"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/novagwamrtx-hub/Gmod-builder"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
